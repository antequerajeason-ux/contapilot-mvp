<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ContaPilot | Acceso</title>
  <style>
    :root{
      --bg:#05070c;--surface:rgba(255,255,255,.035);--surface-strong:rgba(255,255,255,.06);
      --ink:#f2f5f9;--muted:#8b96ab;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.20);
      --primary:#2f8fe0;--primary-dark:#1c6fb3;--primary-soft:rgba(47,143,224,.16);
      --green:#1fb98a;--radius:16px
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
      background:
        radial-gradient(900px 480px at 50% -10%, rgba(47,143,224,.20), transparent 60%),
        radial-gradient(700px 380px at 90% 10%, rgba(47,143,224,.08), transparent 60%),
        var(--bg);
      min-height:100vh;display:flex;flex-direction:column
    }
    button,input{font-family:inherit}
    .corner-brand{position:fixed;top:22px;left:24px;display:flex;align-items:center;gap:8px;z-index:5}
    .corner-brand img{width:36px;height:36px;object-fit:contain}
    .corner-brand span{color:var(--ink);font-weight:700;font-size:14.5px;letter-spacing:.01em}
    .shell{flex:1;display:flex;align-items:center;justify-content:center;padding:90px 20px 40px}
    .auth-card{
      width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:26px;backdrop-filter:blur(18px);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)
    }
    .tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:20px}
    .tab{flex:1;height:36px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;transition:.15s}
    .tab.active{background:var(--surface-strong);color:var(--ink);border:1px solid var(--line-strong)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .field input{height:42px;width:100%;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:rgba(255,255,255,.03);outline:0;font-size:14px;color:var(--ink);transition:.15s}
    .field input::placeholder{color:#5b6577}
    .field input:focus{border-color:var(--primary);background:rgba(255,255,255,.05)}
    .btn{
      height:44px;width:100%;border:1px solid rgba(47,143,224,.55);border-radius:10px;
      background:linear-gradient(180deg,var(--primary),var(--primary-dark));color:#fff;font-weight:700;font-size:14px;
      cursor:pointer;margin-top:4px;box-shadow:0 8px 24px -10px rgba(47,143,224,.6);transition:.15s
    }
    .btn:hover{filter:brightness(1.08)}
    .btn:active{transform:translateY(1px)}
    .log{margin-top:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);color:#c3cbda;border-radius:9px;padding:11px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.5;display:none}
    .log.show{display:block}
    .footnote{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
  </style>
<script src="config.js"></script>
</head>
<body>
  <div class="corner-brand"><img src="contapilot-symbol-transparent.png" alt="ContaPilot"><span>ContaPilot</span></div>
  <main class="shell">
    <section class="auth-card">
      <h1 style="font-size:18px;margin:0 0 4px">Ingresa a tu cuenta</h1>
      <p style="margin:0 0 20px;color:var(--muted);font-size:13px">¿No tienes cuenta? Tu asesor ContaPilot te comparte el acceso tras activar tu suscripción.</p>
      <div class="field"><label>Email</label><input id="email" placeholder="tucorreo@empresa.com"></div>
      <div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="••••••••"></div>
      <button class="btn" onclick="submitAuth()" id="submitBtn">Iniciar sesión</button>
      <div id="log" class="log"></div>
      <p class="footnote">Integrado con Siigo Nube</p>
    </section>
  </main>
<script>
function base(){return localStorage.getItem('cp_api_base')||window.CONTAPILOT_API_BASE||''}function log(m,o){logEl=document.getElementById('log');logEl.classList.add('show');logEl.textContent=m+(o?'\n'+JSON.stringify(o,null,2):'')}async function api(path,opts={}){const r=await fetch(base()+path,{headers:{'Content-Type':'application/json'},...opts});const data=await r.json().catch(()=>({}));if(!r.ok){const d=data.detail||data.error||data;throw new Error(typeof d==='string'?d:JSON.stringify(d))}return data}async function submitAuth(){try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem('cp_token',data.token);localStorage.setItem('cp_user',JSON.stringify(data.user));location.href='centro-facturas.html'}catch(e){log('Error', {error:e.message})}}
</script>
</body>
</html>
