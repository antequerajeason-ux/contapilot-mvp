CONTA PILOT MVP - V18 ERROR DETALLADO SIIGO

Esta versión no cambia el flujo. Mejora el diagnóstico cuando Siigo responde error 400.

Ahora, si Siigo rechaza una factura, ContaPilot muestra:
- Endpoint de Siigo que falló.
- Respuesta completa de Siigo.
- Payload enviado a Siigo, sin credenciales.
- Número de factura, proveedor y NIT si están disponibles.

Objetivo:
Saber exactamente qué campo está rechazando Siigo para corregir el payload real.

Después de subir:
1. Probar con UNA factura.
2. Si falla, copiar completo el error mostrado en Observaciones/log.
